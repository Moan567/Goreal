{
    "version": 3,
    "name": "Goreal",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Standard" },
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageFormat": { "extension": "", "format": "directory" }
    },
    "textures": {
        "package": { "type": "directory", "root": "textures" },
        "format": { "extensions": ["png", "jpg", "jpeg", "tga", "bmp"] },
        "palette": "",
        "property": "textures",
        "shaderSearchPath": "textures"
    },
    "entities": {
        "definitions": [ "Goreal.fgd" ],
        "defaultcolor": "0.6 0.6 0.6",
        "modelformats": [ "obj" ]
    },
    "tags": {
        "brush": [
            { "name": "Trigger", "attribs": [ "transparent" ], "match": "classname", "pattern": "trigger_*" }
        ]
    }
}
